name: ScènePlan — tests de démarrage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils de test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Vérifier la webapp sur formats ordinateur et mobile
        run: python tests/smoke.py
